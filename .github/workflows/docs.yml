name: docs

on:
  push:
    tags: ["v*"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # required for setuptools-scm
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          cache-python: true
      - run: uv sync --no-dev --group docs
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: |
          FULL_VERSION=$(python -c "import importlib.metadata; print(importlib.metadata.version('anydyce'))")
          MINOR_VERSION=$(python -c "
          v = '$FULL_VERSION'.split('.')
          print(f'{v[0]}.{v[1]}')
          ")
          uv run mike deploy --push --update-aliases "$MINOR_VERSION" latest
