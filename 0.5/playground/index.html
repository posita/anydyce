<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dyceum Playground</title>
  <!-- themes.css (Layer 1: raw color slots per theme family) loads
       first; playground.css (Layer 2: maps --syn-*/--accent onto those
       slots) references them. Order is not strictly required -- the two
       define disjoint variables and var() resolves lazily -- but data
       before mapping reads more naturally. -->
  <link rel="stylesheet" href="themes.css" />
  <link rel="stylesheet" href="playground.css" />
</head>
<body>
  <header>
    <h1><a href="https://posita.github.io/dyce/" target="_blank"><img alt="dyce-powered!" src="https://raw.githubusercontent.com/posita/dyce/latest/docs/dyce-powered.svg" align="absmiddle" ></a> Dyceum Playground - <a href="../anydice/" target="_blank">Beta</a></h1>
    <div class="header-meta">
      <select id="theme-select" class="theme-select" aria-label="Theme">
        <option value="default">Default</option>
        <option value="colorblind">Colorblind</option>
        <option value="high-contrast">High contrast</option>
        <option value="no-color">No color</option>
      </select>
      <div class="accent-picker" role="group" aria-label="Accent color">
        <button type="button" class="accent-swatch" data-accent-choice="red" aria-label="Red accent" title="Red"></button>
        <button type="button" class="accent-swatch" data-accent-choice="yellow" aria-label="Yellow accent" title="Yellow"></button>
        <button type="button" class="accent-swatch" data-accent-choice="green" aria-label="Green accent" title="Green"></button>
        <button type="button" class="accent-swatch" data-accent-choice="cyan" aria-label="Cyan accent" title="Cyan"></button>
        <button type="button" class="accent-swatch" data-accent-choice="blue" aria-label="Blue accent" title="Blue"></button>
        <button type="button" class="accent-swatch" data-accent-choice="magenta" aria-label="Magenta accent" title="Magenta"></button>
      </div>
    </div>
  </header>

  <main>
    <section class="pane editor-pane">
      <div class="pane-header">
        <h2>Source</h2>
        <!--
          The Run button starts in its "Loading..." shape (disabled, with a
          startup tooltip); playground.js morphs it through Run / Running... at
          runtime via the enter*State helpers (Cancel lives in the output
          pane's run-in-progress indicator, not here). The "Starting up..."
          strings in the status span and output placeholder are likewise
          pre-init defaults rewritten at runtime. There is no shared constant
          for these strings, so rewording means updating both places.
        -->
        <div class="pane-actions">
          <button id="share-btn" class="btn btn-secondary" title="Copy a shareable URL containing this program">Share URL</button>
          <button id="run-btn" class="btn" disabled title="Starting the runtime...">Loading...</button>
        </div>
      </div>
      <div id="editor"></div>
    </section>

    <div id="col-resizer" class="col-resizer" role="separator" aria-orientation="vertical" aria-label="Resize editor and output panes"></div>

    <div class="right-column">
      <section class="pane output-pane">
        <div class="pane-header">
          <h2>Output</h2>
          <div class="pane-actions">
            <a id="csv-link" class="csv-link disabled" aria-disabled="true" title="Run a program to enable CSV export" download>Download CSV</a>
            <div class="view-toggle" role="group" aria-label="Output view mode">
              <button id="view-ridge-btn" type="button" class="active">Ridge</button>
              <button id="view-bars-btn" type="button">Bars</button>
              <button id="view-lines-btn" type="button">Lines</button>
              <button id="view-text-btn" type="button">Text</button>
            </div>
            <button id="maximize-btn" type="button" class="btn btn-secondary icon-btn" aria-pressed="false" aria-label="Maximize the output panel (hides editor and logs)" title="Maximize the output panel (hides editor and logs)">
              <!-- Two glyphs; CSS shows one per [aria-pressed] state. Both
                   stroke currentColor so they follow the button's theme
                   color. aria-hidden: the button's aria-label is the name. -->
              <svg class="icon icon-maximize" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /></svg>
              <svg class="icon icon-restore" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5" /></svg>
            </button>
          </div>
        </div>
        <!--
          Single message surface: the ONE place any non-result text appears --
          the startup / ready prompt, "Running..." (with Cancel), "(cancelled)",
          and error summaries. playground.js's showMessage / showOutputViews
          toggle it against the result views (never both at once), so every
          status message shares one location and style rather than each render
          path styling its own. The Cancel button shows only in the running
          state, and only once the run outlasts CANCEL_REVEAL_MS.
        -->
        <div id="output-message" class="output-message">
          <span id="output-message-text" class="output-message-text">Starting up...</span>
          <button id="output-cancel" type="button" class="btn btn-secondary hidden">Cancel</button>
        </div>
        <div id="output-bars" class="output-view hidden"></div>
        <div id="output-lines" class="output-view hidden"></div>
        <div id="output-ridge" class="output-view hidden"></div>
        <div id="output-text" class="output-view hidden"></div>
      </section>

      <div id="row-resizer" class="row-resizer" role="separator" aria-orientation="horizontal" aria-label="Resize output and logs panes"></div>

      <section class="pane logs-pane">
        <div class="pane-header">
          <h2>Logs</h2>
          <span class="status" id="status">Starting up...</span>
        </div>
        <div id="logs-placeholder" class="pane-placeholder">
          Warnings and errors from the current run will appear here.
        </div>
        <div id="logs" class="hidden"></div>
      </section>
    </div>
  </main>

  <!--
    Pyodide loads inside the Web Worker (pyodide-worker.js), not on the
    main thread, so there's no <script src="pyodide.js"> tag here. The
    worker uses importScripts() to pull in Pyodide from the CDN.
  -->

  <!--
    Import map: pin all CodeMirror 6 + Lezer packages to specific versions on
    esm.sh so that every sub-package shares the same module instances. Without
    this, esm.sh resolves each sub-package independently and bundles its own
    copies of peer deps -- you get duplicate-instance bugs that surface as
    opaque "extension is undefined" errors or "can't access property
    Symbol.iterator on undefined" deep in CodeMirror's internals.

    The "*" prefix on URLs (e.g. "*@codemirror/view") tells esm.sh to
    externalize peer deps for that package rather than bundling them. Any
    package with peer deps needs "*"; leaf packages (no peer deps) don't.
    Currently "*"-prefixed: @codemirror/*, @lezer/highlight, @lezer/lr,
    codemirror. Leaf: @codemirror/state, @lezer/common, style-mod, w3c-keyname,
    crelt.

    plotly.js's version should match that in dyce.
  -->
  <script type="importmap">
    {
      "imports": {
        "@codemirror/state":    "https://esm.sh/@codemirror/state@6.5.2",
        "@codemirror/view":     "https://esm.sh/*@codemirror/view@6.36.2",
        "@codemirror/language": "https://esm.sh/*@codemirror/language@6.10.8",
        "@codemirror/commands": "https://esm.sh/*@codemirror/commands@6.7.1",
        "@codemirror/search":   "https://esm.sh/*@codemirror/search@6.5.8",
        "@codemirror/autocomplete": "https://esm.sh/*@codemirror/autocomplete@6.18.4",
        "@codemirror/lint":     "https://esm.sh/*@codemirror/lint@6.8.4",
        "@lezer/common":        "https://esm.sh/@lezer/common@1.2.3",
        "@lezer/highlight":     "https://esm.sh/*@lezer/highlight@1.2.1",
        "@lezer/lr":            "https://esm.sh/*@lezer/lr@1.4.2",
        "style-mod":            "https://esm.sh/style-mod@4.1.2",
        "w3c-keyname":          "https://esm.sh/w3c-keyname@2.2.8",
        "crelt":                "https://esm.sh/crelt@1.0.6",
        "codemirror":           "https://esm.sh/*codemirror@6.0.1",
        "plotly.js-cartesian-dist-min": "https://esm.sh/plotly.js-cartesian-dist-min@3.7.0"
      }
    }
  </script>
  <script type="module" src="playground.js"></script>
</body>
</html>
